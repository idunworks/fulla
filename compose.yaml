# docker compose up -d   (after: cp config.example.env .env, and editing it)
services:
  fulla:
    build:
      context: .
      args:
        # Empty: Fulla has the host to itself. See config.example.env.
        FULLA_BASE_PATH: ${FULLA_BASE_PATH:-}
    image: fulla:local
    env_file: .env
    ports:
      # Bound to this machine only: put a TLS proxy in front (docs/self-hosting.md).
      - "127.0.0.1:3000:3000"
    volumes:
      - fulla-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  fulla-data:
